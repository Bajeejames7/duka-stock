<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12634b"><meta name="description" content="Photo-based shop stock logging">
  <title>Duka Stock</title><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <header><h1>Duka Stock</h1><span id="pending" role="status"></span></header>
  <nav aria-label="Main navigation"><button data-screen="entry">Stock entry</button><button data-screen="products">Products</button><button data-screen="recent">Recent log</button><button data-screen="settings">Settings</button></nav>
  <main>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="welcome" hidden><h2>Your name</h2><form id="name-form">
      <label>Your name<input id="welcome-staff" required maxlength="100" autocomplete="name"></label>
      <button type="submit">Continue</button>
    </form></section>
    <section id="settings" hidden><h2>Settings</h2>
      <p id="connection-help" hidden>Open the link you were sent on WhatsApp to connect this phone.</p>
      <form id="settings-form">
      <label>Your name<input id="staff" required maxlength="100" autocomplete="name"></label>
      <details id="advanced-connection"><summary>Advanced connection</summary>
        <label>Apps Script Web App URL<input id="url" type="url" placeholder="https://script.google.com/macros/s/DEPLOYMENT_ID/exec"></label>
        <label>Shop PIN<input id="pin" type="password" autocomplete="off"></label>
      </details>
      <button type="submit">Save</button><button id="reset" type="button" class="secondary">Reset settings</button>
      <p>Your connection and pending entries are stored on this device. Use a trusted phone.</p>
    </form></section>
    <section id="entry" hidden><h2>Log stock</h2>
      <label class="capture">Take or choose product photo<input id="photo" type="file" accept="image/*" capture="environment"></label>
      <img id="preview" alt="Selected product" hidden><div id="matches"></div>
      <form id="entry-form"><p id="selection">New product</p><button id="new-product" type="button" class="secondary">New product / clear</button>
        <div class="fields"><label>Brand<input name="brand" maxlength="100"></label><label>Product name<input name="product_name" required maxlength="200"></label><label>Category<input name="category" maxlength="100"></label><label>Variant<input name="variant" maxlength="200"></label><label>Model number<input name="model_number" maxlength="100"></label><label>Barcode<input name="barcode" maxlength="100"></label></div>
        <label>Action<select name="actionType"><option value="count">Stock count (set exact)</option><option value="received">Received (+)</option><option value="removed">Sold/Removed (−)</option></select></label>
        <label>Quantity<input class="quantity" name="quantity" type="number" min="0" step="1" inputmode="numeric" required></label>
        <label>Price (KES), optional<input name="price" type="number" min="0" step="0.01" inputmode="decimal"></label><label>Notes<textarea name="notes" maxlength="2000"></textarea></label>
        <button type="submit">Save stock entry</button>
      </form>
    </section>
    <section id="products" hidden><h2>Products</h2><label>Search products<input id="search" type="search" placeholder="Name, brand, SKU or barcode"></label><button id="refresh-products" class="secondary">Refresh products</button><div id="product-list"></div></section>
    <section id="recent" hidden><h2>Recent log</h2><button id="refresh-recent" class="secondary">Refresh log</button><div id="recent-list"></div></section>
  </main><script src="app.js" defer></script>
</body></html>
